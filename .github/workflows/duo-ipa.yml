# Duo fork: build the unmodified External JIT .ipa (TolkaraDiagnostics) and keep it as a
# workflow artifact for wolkaraforever/duo/fetch_ipa.sh on the Linux machine that signs it.
#
# Differs from release.yml only where release.yml is known to fail:
#   - v1.0.20 failed on macos-26's default Xcode (iOS 27 AVAudioSession API missing), so this
#     job selects Xcode 27 exactly as validate.yml does, on the runner label validate.yml uses;
#   - nothing is published as a release: the .ipa is an artifact of the run.
# No Apple credential, certificate, profile or device record is used or needed here: the
# package is unsigned (ad hoc), and signing happens on the user's own machine with xtool.

name: Duo IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (default: the branch the run starts on)"
        required: false
  push:
    branches: [duo-baseline]
    paths-ignore: ["**.md", "docs/**", "duo/**"]

permissions:
  contents: read

concurrency:
  group: duo-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  IPA: wolkaraforever-duo-unsigned.ipa
  # Stable on purpose: xtool registers it as XTL-<team>.<this>, and the same identifier on
  # every install is what keeps the downloaded game and settings across weekly re-signing.
  TOLKARA_BUNDLE_ID: local.wolkaraforever.duo
  TOLKARA_KEYCHAIN_GROUP: local.wolkaraforever.duo.authorization

jobs:
  ipa:
    name: Unsigned External JIT .ipa
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Built commit
        run: |
          echo "built commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Use Xcode 27
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        run: brew install xcodegen

      # Built-in JIT's helper embeds StikJIT (MPL-2.0) from its release, pinned by checksum.
      # Source: https://github.com/StikDebug/StikJIT (tag 2.0.1). project.yml reads vendor/.
      - name: Fetch StikJIT 2.0.1
        run: |
          mkdir -p vendor
          curl -fsSL -o vendor/StikJIT.xcframework.zip \
            https://github.com/StikDebug/StikJIT/releases/download/2.0.1/StikJIT.xcframework.zip
          echo "c376687326a785f5ed1da8caca08adc709b56919019dd751bca059b92b175d95  vendor/StikJIT.xcframework.zip" | shasum -a 256 -c
          unzip -q vendor/StikJIT.xcframework.zip -d vendor
          test -f vendor/StikJIT.xcframework/ios-arm64/StikJIT.framework/universal.js

      # Same commands as release.yml: the platform packager, then the repository's verifier
      # (one app, no extension, no profile, no team, memory entitlements declared, root
      # certificates present - without them every Battle.net login fails with BLZ51900003).
      - name: Build the unsigned .ipa
        run: wolkaraforever/tools/package_ipa.sh "$IPA"

      - name: Verify the .ipa
        run: wolkaraforever/tools/verify_ipa.sh "$IPA" verify-report.txt

      # The render table decides the scale the game is given (the Duo's native-scale Quality).
      # Foundation only, against the tree the packager just prepared.
      - name: Device profile tests
        run: |
          cd build/platform && mkdir -p build/wow-launcher
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -O1 -g -framework Foundation \
            launcher/WoW/DeviceProfile.m tests/test_device_profile.m -o build/wow-launcher/test_device_profile
          build/wow-launcher/test_device_profile

      - name: Checksum
        run: |
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          { echo '```'; cat "$IPA.sha256"; cat verify-report.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wolkaraforever-duo-ipa
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            verify-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Keep the build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            logs/
            build/platform/logs/
          retention-days: 7
          if-no-files-found: ignore
