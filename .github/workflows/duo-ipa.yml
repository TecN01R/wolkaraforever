# No-Mac fork: build the External JIT .ipa (TolkaraDiagnostics, with the Built-in JIT helper) and
# publish it. Every green build of duo-baseline becomes a GitHub Release, so anyone can download
# releases/latest/download/wolkaraforever-duo-unsigned.ipa and sign it on Linux with xtool
# (docs/INSTALL-WITHOUT-A-MAC.md). The run's artifact stays for wolkaraforever/duo/fetch_ipa.sh.
#
# Differs from release.yml only where release.yml is known to fail:
#   - v1.0.20 failed on macos-26's default Xcode (iOS 27 AVAudioSession API missing), so this
#     job selects Xcode 27 exactly as validate.yml does, on the runner label validate.yml uses;
#   - the release is unsigned and carries no game files; signing happens on the user's machine.
# No Apple credential, certificate, profile or device record is used or needed here: the
# package is unsigned (ad hoc), and signing happens on the user's own machine with xtool.

name: Duo IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (default: the branch the run starts on)"
        required: false
      publish:
        description: "Publish the build as a release (only for duo-baseline itself; used by upstream-sync.yml)"
        type: boolean
        default: false
  push:
    branches: [duo-baseline]
    paths-ignore: ["**.md", "docs/**", "duo/**", "llms.txt"]

permissions:
  contents: read

concurrency:
  group: duo-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  IPA: wolkaraforever-duo-unsigned.ipa
  # Stable on purpose: xtool registers it as XTL-<team>.<this>, and the same identifier on
  # every install is what keeps the downloaded game and settings across weekly re-signing.
  TOLKARA_BUNDLE_ID: local.wolkaraforever.duo
  TOLKARA_KEYCHAIN_GROUP: local.wolkaraforever.duo.authorization

jobs:
  ipa:
    name: Unsigned External JIT .ipa
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write   # the release step only
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Built commit
        run: |
          echo "built commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Use Xcode 27
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install XcodeGen
        run: brew install xcodegen

      # Built-in JIT's helper embeds StikJIT (MPL-2.0) from its release, pinned by checksum.
      # Source: https://github.com/StikDebug/StikJIT (tag 2.0.1). project.yml reads vendor/.
      - name: Fetch StikJIT 2.0.1
        run: |
          mkdir -p vendor
          curl -fsSL -o vendor/StikJIT.xcframework.zip \
            https://github.com/StikDebug/StikJIT/releases/download/2.0.1/StikJIT.xcframework.zip
          echo "c376687326a785f5ed1da8caca08adc709b56919019dd751bca059b92b175d95  vendor/StikJIT.xcframework.zip" | shasum -a 256 -c
          unzip -q vendor/StikJIT.xcframework.zip -d vendor
          test -f vendor/StikJIT.xcframework/ios-arm64/StikJIT.framework/universal.js

      # Same commands as release.yml: the platform packager, then the repository's verifier
      # (one app, the Built-in JIT helper as its only extension, no profile, no team, memory
      # entitlements and Game Mode declared, root certificates present - without them every
      # Battle.net login fails with BLZ51900003).
      - name: Build the unsigned .ipa
        run: wolkaraforever/tools/package_ipa.sh "$IPA"

      - name: Verify the .ipa
        run: wolkaraforever/tools/verify_ipa.sh "$IPA" verify-report.txt

      # The render table decides the scale the game is given (the Duo's native-scale Quality).
      # Foundation only, against the tree the packager just prepared.
      - name: Device profile tests
        run: |
          cd build/platform && mkdir -p build/wow-launcher
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -O1 -g -framework Foundation \
            launcher/WoW/DeviceProfile.m tests/test_device_profile.m -o build/wow-launcher/test_device_profile
          build/wow-launcher/test_device_profile

      # The UI Manager's Config.wtf rules (graphics reset, full reset, gamepad, locale), the
      # Config.wtf half of wolkaraforever/tools/test_forever_ui.sh. Foundation only.
      - name: Config.wtf rules tests
        run: |
          cd build/platform && mkdir -p build/forever-ui
          for source in launcher/WoW/ForeverUI.m launcher/App/WKLocalization.m tests/test_forever_config.m; do
            xcrun clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations -Ilauncher/WoW \
              -c "$source" -o "build/forever-ui/$(basename "$source" .m).o"
          done
          xcrun clang -fobjc-arc build/forever-ui/*.o -framework Foundation -o build/forever-ui/test_forever_config
          build/forever-ui/test_forever_config

      - name: Checksum
        run: |
          shasum -a 256 "$IPA" | tee "$IPA.sha256"
          { echo '```'; cat "$IPA.sha256"; cat verify-report.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wolkaraforever-duo-ipa
          path: |
            ${{ env.IPA }}
            ${{ env.IPA }}.sha256
            verify-report.txt
          if-no-files-found: error
          retention-days: 30

      # A push to duo-baseline publishes. A manual run publishes only when asked to and when it
      # built duo-baseline itself (upstream-sync.yml asks after its own push, which GitHub does
      # not let trigger this workflow).
      - name: Publish the release
        if: github.event_name == 'push' || (inputs.publish && !inputs.ref && github.ref == 'refs/heads/duo-baseline')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(git rev-parse HEAD)
          short=${built::7}
          tag="duo-$(date -u +%Y%m%d)-$short"
          cat > notes.md <<EOF
          Unsigned WolkaraForever for iPhone and iPad (External JIT with Built-in JIT), built from
          ${built}. Sign and install it from Linux with a free Apple ID: no Mac and no paid
          developer account. Step-by-step guide:
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/duo-baseline/docs/INSTALL-WITHOUT-A-MAC.md

          Only tested on one iPhone Duo (iOS 27.2.1). Provided as is: no claims about its effectiveness
          or correctness, and no support. Unofficial, not affiliated with Blizzard, Apple or upstream.

          Contains no game files. Embeds StikJIT 2.0.1 unmodified (MPL-2.0); its source is at
          https://github.com/StikDebug/StikJIT/tree/2.0.1.

          SHA-256: $(cut -d' ' -f1 "$IPA.sha256")
          EOF
          gh release create "$tag" "$IPA" "$IPA.sha256" verify-report.txt \
            --target "$built" --title "WolkaraForever no-Mac build $short" --notes-file notes.md --latest

      - name: Keep the build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            logs/
            build/platform/logs/
          retention-days: 7
          if-no-files-found: ignore
